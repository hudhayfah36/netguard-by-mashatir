name: Build ESP32-S3 firmware

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.5
    steps:
      - uses: actions/checkout@v4
      - run: . /opt/esp/idf/export.sh && idf.py set-target esp32s3 && idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: netguard-esp32s3-build
          path: build/netguard.bin
