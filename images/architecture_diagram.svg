<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">NetGuard DNS filtering flow</title><desc id="d">Animated DNS flow from client devices through NetGuard to Cloudflare Family DNS.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="ng" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="dev" x2="1" y2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><g opacity=".08" stroke="#67e8f9"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/><path d="M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560M1000 0V560M1100 0V560"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="55" font-size="31" font-weight="700" fill="white">How NetGuard Works</text><text x="600" y="82" font-size="15" fill="#a5f3fc">DNS is checked locally before permitted requests leave the network</text></g>
<g filter="url(#s)"><rect x="55" y="140" width="245" height="86" rx="16" fill="url(#dev)"/><rect x="55" y="250" width="245" height="86" rx="16" fill="url(#dev)"/><rect x="55" y="360" width="245" height="86" rx="16" fill="url(#dev)"/></g>
<g font-family="Arial" text-anchor="middle" fill="white"><text x="177" y="175" font-size="17" font-weight="700">Family device</text><text x="177" y="202" font-size="13">Phone, laptop, or tablet</text><text x="177" y="285" font-size="17" font-weight="700">Study device</text><text x="177" y="312" font-size="13">Profile and schedule</text><text x="177" y="395" font-size="17" font-weight="700">Shared device</text><text x="177" y="422" font-size="13">Network-wide safety</text></g>
<g fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#a)"><path d="M300 183C360 183 388 220 440 240"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M300 293C360 293 388 285 440 280"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M300 403C360 403 388 345 440 320"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/></path></g>
<g filter="url(#s)"><rect x="440" y="135" width="340" height="295" rx="22" fill="url(#ng)"/><rect x="465" y="245" width="290" height="43" rx="9" fill="white" opacity=".16"/><rect x="465" y="300" width="290" height="43" rx="9" fill="white" opacity=".16"/><rect x="465" y="355" width="290" height="43" rx="9" fill="white" opacity=".16"/></g>
<circle cx="480" cy="180" r="11" fill="#fef08a"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle><g font-family="Arial" fill="white"><text x="610" y="180" text-anchor="middle" font-size="24" font-weight="700">NetGuard by Mashatir</text><text x="610" y="210" text-anchor="middle" font-size="14">Local ESP32-S3 DNS appliance</text><text x="485" y="272" font-size="16">1. Global block rules</text><text x="485" y="327" font-size="16">2. Device profile rules</text><text x="485" y="382" font-size="16">3. Daily schedules and alerts</text></g>
<path d="M780 280H875" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur=".8s" repeatCount="indefinite"/></path><g filter="url(#s)"><rect x="875" y="220" width="245" height="120" rx="18" fill="#db2777"/></g><g text-anchor="middle" font-family="Arial" fill="white"><text x="997" y="265" font-size="19" font-weight="700">Cloudflare Family</text><text x="997" y="292" font-size="14">Filtered upstream DNS</text><text x="997" y="316" font-size="13">1.1.1.3 / 1.0.0.3</text></g><path d="M1120 280H1150" stroke="#fef08a" stroke-width="4" marker-end="url(#a)"/><circle cx="1165" cy="280" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2"><animate attributeName="r" values="24;28;24" dur="2s" repeatCount="indefinite"/></circle><text x="1165" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Web</text>
<g fill="#fef08a"><circle r="6"><animateMotion dur="2s" repeatCount="indefinite" path="M300 183C360 183 388 220 440 240"/></circle><circle r="6"><animateMotion begin=".7s" dur="2s" repeatCount="indefinite" path="M300 293C360 293 388 285 440 280"/></circle><circle r="6"><animateMotion begin="1s" dur="1.5s" repeatCount="indefinite" path="M780 280H875"/></circle></g><text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="15" fill="#cbd5e1">Local-first • No cloud account • No browsing-history upload</text>
</svg>
