<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Network grid pattern -->
  <g opacity="0.1">
    <path d="M0 50 L800 50 M0 100 L800 100 M0 150 L800 150 M0 200 L800 200 M0 250 L800 250 M0 300 L800 300 M0 350 L800 350" stroke="#4ecca3" stroke-width="1"/>
    <path d="M50 0 L50 400 M100 0 L100 400 M150 0 L150 400 M200 0 L200 400 M250 0 L250 400 M300 0 L300 400 M350 0 L350 400 M400 0 L400 400 M450 0 L450 400 M500 0 L500 400 M550 0 L550 400 M600 0 L600 400 M650 0 L650 400 M700 0 L700 400 M750 0 L750 400" stroke="#4ecca3" stroke-width="1"/>
  </g>
  
  <!-- Central Device Box (Tiny Box) -->
  <g transform="translate(400, 200)" filter="url(#shadow)">
    <!-- Box body with 3D effect -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="url(#boxGradient)" filter="url(#glow)"/>
    <rect x="-60" y="-40" width="120" height="20" rx="8" fill="#6ee7b7" opacity="0.3"/>
    
    <!-- LED indicator -->
    <circle cx="-40" cy="0" r="4" fill="#fbbf24" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Platform Name -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">NetGuard</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">by Mashatir</text>
    
    <!-- Shield icon -->
    <path d="M45 -30 L55 -25 L55 -15 L45 -10 L35 -15 L35 -25 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M40 -22 L48 -18" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Protected Devices -->
  <g transform="translate(200, 120)">
    <!-- Laptop icon -->
    <rect x="-40" y="-25" width="80" height="50" rx="4" fill="#4a5568" opacity="0.8"/>
    <rect x="-35" y="-20" width="70" height="35" rx="2" fill="#2d3748"/>
    <rect x="-30" y="-15" width="60" height="25" rx="1" fill="#4ecca3" opacity="0.3"/>
    <text x="0" y="40" font-family="Arial" font-size="12" fill="#e0e0e0" text-anchor="middle">Family Devices</text>
  </g>
  
  <g transform="translate(600, 120)">
    <!-- Phone icon -->
    <rect x="-25" y="-35" width="50" height="70" rx="6" fill="#4a5568" opacity="0.8"/>
    <rect x="-20" y="-30" width="40" height="55" rx="3" fill="#2d3748"/>
    <rect x="-15" y="-25" width="30" height="40" rx="1" fill="#4ecca3" opacity="0.3"/>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#e0e0e0" text-anchor="middle">Mobile</text>
  </g>
  
  <g transform="translate(200, 280)">
    <!-- Tablet icon -->
    <rect x="-35" y="-30" width="70" height="60" rx="5" fill="#4a5568" opacity="0.8"/>
    <rect x="-30" y="-25" width="60" height="45" rx="2" fill="#2d3748"/>
    <rect x="-25" y="-20" width="50" height="35" rx="1" fill="#4ecca3" opacity="0.3"/>
    <text x="0" y="45" font-family="Arial" font-size="12" fill="#e0e0e0" text-anchor="middle">Tablet</text>
  </g>
  
  <g transform="translate(600, 280)">
    <!-- Desktop icon -->
    <rect x="-35" y="-30" width="70" height="50" rx="3" fill="#4a5568" opacity="0.8"/>
    <rect x="-30" y="-25" width="60" height="40" rx="1" fill="#2d3748"/>
    <rect x="-25" y="-20" width="50" height="30" rx="1" fill="#4ecca3" opacity="0.3"/>
    <rect x="-10" y="20" width="20" height="15" fill="#4a5568" opacity="0.8"/>
    <rect x="-20" y="35" width="40" height="5" rx="2" fill="#4a5568" opacity="0.8"/>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#e0e0e0" text-anchor="middle">Desktop</text>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#4ecca3" stroke-width="2" opacity="0.4" stroke-dasharray="5,5">
    <line x1="240" y1="145" x2="340" y2="180"/>
    <line x1="560" y1="145" x2="460" y2="180"/>
    <line x1="240" y1="255" x2="340" y2="220"/>
    <line x1="560" y1="255" x2="460" y2="220"/>
  </g>
  
  <!-- Blocked threats -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="25" fill="#e53e3e" opacity="0.2"/>
    <text x="0" y="5" font-family="Arial" font-size="24" fill="#fc8181" text-anchor="middle">×</text>
    <text x="0" y="40" font-family="Arial" font-size="10" fill="#fc8181" text-anchor="middle">Blocked</text>
  </g>
  
  <g transform="translate(700, 80)">
    <circle cx="0" cy="0" r="25" fill="#e53e3e" opacity="0.2"/>
    <text x="0" y="5" font-family="Arial" font-size="24" fill="#fc8181" text-anchor="middle">×</text>
    <text x="0" y="40" font-family="Arial" font-size="10" fill="#fc8181" text-anchor="middle">Filtered</text>
  </g>
  
  <!-- Title and Tagline -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">NetGuard by Mashatir</text>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="14" fill="#4ecca3" text-anchor="middle">Privacy-First DNS Safety for Families &amp; Schools</text>
  
  <!-- Bottom tagline -->
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">Local-First • No Cloud • No Subscription • ESP32-S3 Powered</text>
</svg>
